<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kikos Fitness — Sistemas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --preto-fundo: #0c0d10;
    --preto-carvao: #1a1b1f;
    --preto-carvao-2: #222329;
    --vermelho-kikos: #e52322;
    --vermelho-brilho: #ff4b4a;
    --cinza-metal: #b9bcc3;
    --branco: #f5f5f7;
    --borda-sutil: rgba(255, 255, 255, 0.08);
    --sombra-vermelha: rgba(229, 35, 34, 0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--preto-fundo); color:var(--branco);
    font-family:Arial, Helvetica, sans-serif;
    display:flex; flex-direction:column;
  }

  header.hub-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 24px;
    background:var(--preto-carvao);
    border-bottom:1px solid var(--borda-sutil);
    flex-wrap:wrap;
  }

  .hub-brand{
    display:flex; align-items:center; gap:12px;
    font-family:"Rajdhani", Arial, sans-serif;
    font-weight:700; font-size:20px; letter-spacing:0.02em;
  }
  .hub-brand .dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--vermelho-kikos);
    box-shadow:0 0 0 4px var(--sombra-vermelha);
  }

  nav.hub-tabs{
    display:flex; gap:6px; background:var(--preto-carvao-2);
    padding:5px; border-radius:10px; border:1px solid var(--borda-sutil);
  }
  nav.hub-tabs button{
    font-family:"Rajdhani", Arial, sans-serif;
    font-weight:600; font-size:15px; letter-spacing:0.02em;
    color:var(--cinza-metal); background:transparent; border:none;
    padding:9px 18px; border-radius:7px; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  nav.hub-tabs button:hover{ color:var(--branco); }
  nav.hub-tabs button.ativo{
    background:var(--vermelho-kikos); color:#fff;
    box-shadow:0 0 0 3px var(--sombra-vermelha);
  }

  main.hub-body{ flex:1; position:relative; min-height:0; }
  main.hub-body iframe{
    position:absolute; inset:0; width:100%; height:100%;
    border:none; background:var(--preto-fundo);
    display:none;
  }
  main.hub-body iframe.ativo{ display:block; }

  @media (max-width:640px){
    header.hub-header{ flex-direction:column; align-items:stretch; }
    nav.hub-tabs{ justify-content:space-between; }
    nav.hub-tabs button{ flex:1; padding:9px 8px; font-size:13px; text-align:center; }
  }
</style>
</head>
<body>

  <header class="hub-header">
    <div class="hub-brand"><span class="dot"></span> Kikos Fitness</div>
    <nav class="hub-tabs" id="hub-tabs">
      <button data-alvo="orcamento" class="ativo">Orçamento</button>
      <button data-alvo="interno">Orçamento Interno</button>
      <button data-alvo="radar">Radar de Leads</button>
    </nav>
  </header>

  <main class="hub-body" id="hub-body">
    <iframe id="frame-orcamento" class="ativo" data-carregado="1" src="orcamento/index.html" title="Orçamento"></iframe>
    <iframe id="frame-interno" data-src="interno/index.html" title="Orçamento Interno"></iframe>
    <iframe id="frame-radar" data-src="radar/index.html" title="Radar de Leads"></iframe>
  </main>

  <script>
    const botoes = document.querySelectorAll('#hub-tabs button');
    const frames = {
      orcamento: document.getElementById('frame-orcamento'),
      interno: document.getElementById('frame-interno'),
      radar: document.getElementById('frame-radar'),
    };

    // Lê a aba inicial da URL (ex: ?aba=radar), se houver
    const params = new URLSearchParams(window.location.search);
    const abaInicial = params.get('aba');

    function ativarAba(nome){
      botoes.forEach(b => b.classList.toggle('ativo', b.dataset.alvo === nome));
      Object.entries(frames).forEach(([chave, frame]) => {
        const ativo = chave === nome;
        frame.classList.toggle('ativo', ativo);
        // Carrega o iframe sob demanda (lazy load) na primeira vez que a aba é aberta
        if(ativo && !frame.dataset.carregado){
          frame.src = frame.dataset.src;
          frame.dataset.carregado = "1";
        }
      });
      const url = new URL(window.location);
      url.searchParams.set('aba', nome);
      window.history.replaceState({}, '', url);
    }

    botoes.forEach(botao => {
      botao.addEventListener('click', () => ativarAba(botao.dataset.alvo));
    });

    if(abaInicial && frames[abaInicial]){
      ativarAba(abaInicial);
    }
  </script>

</body>
</html>
